<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Consulta</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            background: #f3f5f7;
            padding: 24px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 960px;
            background: #ffffff;
            border-radius: 12px;
            padding: 24px 28px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 4px;
            color: #1f2933;
        }

        .subtitle {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 20px;
        }

        form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px 24px;
            margin-bottom: 24px;
            padding: 16px 18px;
            border-radius: 10px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: #374151;
        }

        input,
        select {
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            font-size: 14px;
            outline: none;
            background: #ffffff;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 1px rgba(37,99,235,0.25);
        }

        button {
            margin-top: 18px;
            padding: 10px 18px;
            border-radius: 999px;
            border: none;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.08s ease, box-shadow 0.08s ease, opacity 0.1s;
            justify-self: flex-start;
        }

        button:hover {
            box-shadow: 0 6px 16px rgba(37,99,235,0.35);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
            box-shadow: none;
            opacity: 0.9;
        }

        hr {
            border: none;
            border-top: 1px solid #e5e7eb;
            margin: 20px 0;
        }

        h2 {
            font-size: 18px;
            margin-bottom: 12px;
            color: #1f2933;
        }

        .message {
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .message.success {
            background: #ecfdf3;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .message.error {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            background: #ffffff;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #e5e7eb;
        }

        thead {
            background: #f3f4f6;
        }

        th, td {
            padding: 10px 12px;
            text-align: left;
        }

        th {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: #6b7280;
        }

        tbody tr:nth-child(even) {
            background: #f9fafb;
        }

        tbody tr:hover {
            background: #eef2ff;
        }

        .empty-text {
            font-size: 14px;
            color: #6b7280;
        }

        @media (max-width: 640px) {
            .container {
                padding: 16px;
            }

            form {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Agendar Consulta</h1>
    <p class="subtitle">Preencha os dados abaixo para registrar uma nova consulta.</p>

    <!-- Mensagens de sucesso/erro -->
    <div th:if="${message}" class="message success">
        <p th:text="${message}"></p>
    </div>

    <div th:if="${error}" class="message error">
        <p th:text="${error}"></p>
    </div>

    <form th:action="@{/consultas/form}" method="post">
        <div class="form-group">
            <label for="pacienteId">Paciente ID</label>
            <input type="number" id="pacienteId" name="pacienteId" required>
        </div>

        <div class="form-group">
            <label for="dataHoraConsulta">Data e Hora da Consulta</label>
            <!-- datetime-local manda yyyy-MM-dd'T'HH:mm -->
            <input type="datetime-local" id="dataHoraConsulta" name="dataHoraConsulta" required>
        </div>

        <div class="form-group">
            <label for="medicoId">Médico (opcional)</label>
            <select name="medicoId" id="medicoId">
                <option value="">Escolher Médico</option>
                <th:block th:each="medico : ${medicosDisponiveis}">
                    <option th:value="${medico.id}" th:text="${medico.nome}"></option>
                </th:block>
            </select>
        </div>

        <button type="submit">Agendar</button>
    </form>

    <hr>

    <h2>Consultas agendadas</h2>

    <div th:if="${#lists.isEmpty(consultas)}">
        <p class="empty-text">Nenhuma consulta agendada até o momento.</p>
    </div>

    <table th:if="${!#lists.isEmpty(consultas)}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Paciente</th>
            <th>Médico</th>
            <th>Data/Hora</th>
            <th>Status</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="consulta : ${consultas}">
            <td th:text="${consulta.id}"></td>
            <td th:text="${consulta.paciente.nome}"></td>
            <td th:text="${consulta.medico.nome}"></td>
            <td th:text="${#temporals.format(consulta.dataHoraConsulta, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${consulta.status}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
